name = "Causalean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Causalean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# NOTE ON REQUIRE ORDER: `mathlib` MUST stay LAST among the requires.  The two
# vendored packages below (`FoML`, `optlib`) each `require mathlib from git`
# themselves, and lake resolves shared transitive dependencies (batteries, aesop,
# Qq, proofwidgets, importGraph, plausible, Cli, LeanSearchClient) in require
# order.  With `mathlib` first, those resolve to the vendored packages' stale
# pins, `lake exe cache get` then computes wrong hashes and refuses to fetch.
# Listing `mathlib` last makes Mathlib's own pins win.  Do not reorder.

# The former `clt` require (RemyDegenne/CLT) was dropped when this package moved
# to Mathlib v4.33.0: Mathlib now carries both results we consumed from it.
#   Clt.CLT.central_limit          -> ProbabilityTheory.tendstoInDistribution_inv_sqrt_mul_sum
#                                     (Mathlib.Probability.CentralLimitTheorem; the
#                                     `..._sum_sub` variant additionally covers general
#                                     mean/variance, which `clt` never had)
#   Clt.Inversion.tendsto_iff_tendsto_charFun
#                                  -> same name in Mathlib.MeasureTheory.Measure.LevyConvergence
#                                     (Mathlib upstreamed that file essentially verbatim)
# Upstream CLT was abandoned at Mathlib bf8875c7 (2026-03-04) and has no build for
# any later toolchain, so keeping it would have pinned the whole workspace.

# Vendored FoML (Foundations of ML, lean-rademacher) — Rademacher complexity,
# McDiarmid, symmetrization, separable-sup. Consumed across
# `Causalean/Stat/Concentration/`, `Causalean/Estimation/`, `Causalean/ML/`.
# Adapted, MIT-licensed copy of github.com/auto-res/lean-rademacher, carried
# in-tree so a fresh clone builds without a sibling checkout — see
# `third_party/lean-rademacher/UPSTREAM.md`.
[[require]]
name = "FoML"
path = "third_party/lean-rademacher"

# Vendored optlib (OptSuite) — first-order KKT necessary conditions under LICQ /
# affine CQ (`first_order_neccessary_LICQ` / `_LinearCQ`) + Farkas' lemma engine.
# Only the KKT dependency closure is carried (not the optimizer suite). Adapted,
# Apache-2.0 copy of github.com/optsuite/optlib bumped to AutoID's Mathlib pin —
# see `third_party/optlib/UPSTREAM.md`.
[[require]]
name = "optlib"
path = "third_party/optlib"

# Mathlib LAST — see the require-order note at the top of this file.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "Causalean"

# The `panelquestion_export` lake executable (formerly rooted at
# `Causalean.Panel.Prompt.Export`) moved to the sibling CausalSmith package
# (`CausalSmith/lakefile.toml`) together with the `CausalSmith.Panel.Prompt`
# registry it serializes. The registry was pure CausalSmith infrastructure —
# Causalean never consumed it.

# Library-explorer extractor core (shared with CausalSmith's paper_index exe):
# DeclEntry records + the runIndex driver.
[[lean_lib]]
name = "LibraryIndexCore"

# Library-explorer extractor: walks the elaborated environment and emits
# doc/library_index.json (see CausalSmith/doc/presentation/2026-06-10-library-explorer-design.md).
[[lean_exe]]
name = "library_index"
root = "LibraryIndex"
supportInterpreter = true
