# CausalSmith comments worker — deploy with:
#   cd site/comments-worker && npx wrangler deploy
# Secrets (set once, interactively):
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put GITHUB_READ_TOKEN
name = "causalsmith-comments"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Fill these in before the first deploy (see README.md in this directory).
GITHUB_CLIENT_ID = "Iv23liRnANqlNdLrEp8G"
GITHUB_REPO = "Jiyuan-Tan/CausalSmith"
# Comma-separated GitHub logins muted for reader attestations: refused on write
# and hidden on read. Empty is the normal state (see README "Moderation").
ATTEST_BLOCKLIST = ""
# Comma-separated origins allowed to sign in and read through this worker.
# The DEPLOYED worker allows the production site ONLY — never a localhost origin,
# so a page on a developer's machine can never obtain a token from it. Local
# development uses a separate worker/env with its own temporary allowlist (see
# README "Local development").
ALLOWED_ORIGINS = "https://jiyuan-tan.github.io"

# Per-IP rate limiting via Cloudflare's Workers Rate Limiting binding (GA). The
# worker enforces these at the top of /api/comments and /login, keyed by the
# CF-Connecting-IP; over the limit → 429 with Retry-After. namespace_id is an
# arbitrary integer, unique per binding within the account. If the binding is
# unavailable on the account/plan, the worker no-ops it and the backstop is the
# tightened `n` bound plus a dashboard rate-limit rule (see README).
[[unsafe.bindings]]
name = "API_RATELIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 10 }

[[unsafe.bindings]]
name = "LOGIN_RATELIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 10 }

# Reader attestations (the paper page's Proof map). One KV key per
# (paper, reader). Create the namespace once with
#   npx wrangler kv namespace create ATTESTATIONS
# then UNCOMMENT the binding below and paste the printed id. The block ships
# commented out because wrangler refuses to run ANY command — deploy included —
# over an empty id (observed 2026-08-26). Without the binding the attestation
# endpoints answer 501 and the Proof map panel renders read-only — the rest of
# the worker is unaffected.
# [[kv_namespaces]]
# binding = "ATTESTATIONS"
# id = "<paste the namespace id here>"

# Attestation writes are tighter than reads: a reader marks a handful of
# statements, never dozens a second.
[[unsafe.bindings]]
name = "ATTEST_RATELIMIT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 12, period = 10 }
